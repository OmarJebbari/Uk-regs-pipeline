[project]
name = "uk-regs-pipeline"
version = "0.1.0"
description = "Temporal GraphRAG pipeline for UK Building Regulations — context intelligence"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/extraction",
    "packages/knowledge",
    "packages/reconciliation",
    "packages/evals",
    "pipelines/ingest",
    "apps/api",
    "apps/mcp_server",
]

[tool.uv.sources]
uk_regs_core = { workspace = true }
uk_regs_extraction = { workspace = true }
uk_regs_knowledge = { workspace = true }
uk_regs_reconcile = { workspace = true }
uk_regs_evals = { workspace = true }
uk_regs_ingest = { workspace = true }
uk_regs_api = { workspace = true }
uk_regs_mcp_server = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "pipelines"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true