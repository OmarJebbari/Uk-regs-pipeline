[project]
name = "uk-regs-pipeline"
version = "0.1.0"
description = "Temporal GraphRAG pipeline for UK Building Regulations — context intelligence"
readme = "README.md"
requires-python = ">=3.12"
# Root is the aggregate entry-point: depending on every workspace member
# ensures `uv sync` installs the whole monorepo into the venv so the test
# suite and dev tooling can import all packages.
dependencies = [
    "uk-regs-core",
    "uk-regs-extraction",
    "uk-regs-knowledge",
    "uk-regs-reconcile",
    "uk-regs-evals",
    "uk-regs-ingest",
    "uk-regs-api",
    "uk-regs-mcp-server",
]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/extraction",
    "packages/knowledge",
    "packages/reconciliation",
    "packages/evals",
    "pipelines/ingest",
    "apps/api",
    "apps/mcp_server",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",   # required by FastAPI TestClient
    "mcp>=1.0",      # required by the MCP server build test
]

[tool.uv.sources]
uk_regs_core = { workspace = true }
uk_regs_extraction = { workspace = true }
uk_regs_knowledge = { workspace = true }
uk_regs_reconcile = { workspace = true }
uk_regs_evals = { workspace = true }
uk_regs_ingest = { workspace = true }
uk_regs_api = { workspace = true }
uk_regs_mcp_server = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# TC001/002/003 (flake8-type-checking) intentionally excluded: this is a
# Pydantic-heavy codebase where type-only imports behind TYPE_CHECKING break
# model field resolution at runtime. E501 handled by formatter.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Exception is part of the public API; renaming would be a breaking change.
"packages/core/src/uk_regs_core/errors.py" = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "pipelines"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true