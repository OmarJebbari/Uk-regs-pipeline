# ============================================================================
# Alembic — database migration configuration
# ============================================================================
# The actual DSN is resolved at runtime from POSTGRES_DSN (via env.py), so the
# `sqlalchemy.url` here is intentionally empty. This keeps secrets out of VCS.
#
# Migrations live in `migrations/` at the repo root. Run with:
#   uv run alembic upgrade head      # apply all migrations
#   uv run alembic revision -m "..." # create a new (empty) migration
# ============================================================================

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is set programmatically in migrations/env.py from POSTGRES_DSN
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S