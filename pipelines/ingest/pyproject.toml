[project]
name = "uk-regs-ingest"
version = "0.1.0"
description = "End-to-end ingest pipeline: PDF -> parsed -> extracted -> reconciled -> persisted"
requires-python = ">=3.12"
dependencies = [
    "uk-regs-core",
    "uk-regs-extraction",
    "uk-regs-knowledge",
    "uk-regs-reconcile",
    "click>=8.1",
    "rich>=13.7",
]

[project.scripts]
uk-regs-ingest = "uk_regs_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_regs_ingest"]