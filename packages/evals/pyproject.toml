[project]
name = "uk-regs-evals"
version = "0.1.0"
description = "Golden-set + DeepEval/RAGAS regression harness for the extraction & retrieval pipeline"
requires-python = ">=3.12"
dependencies = [
    "uk-regs-core",
    "uk-regs-knowledge",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_regs_evals"]