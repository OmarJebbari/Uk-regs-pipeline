[project]
name = "uk-regs-evals"
version = "0.1.0"
description = "Golden-set + DeepEval/RAGAS regression harness for the extraction & retrieval pipeline"
requires-python = ">=3.12"
dependencies = [
    "uk-regs-core",
    "uk-regs-knowledge",
    "uk-regs-extraction",
    "uk-regs-reconcile",
    "uk-regs-api",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "click>=8.1",
    "rich>=13.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_regs_evals"]

[project.scripts]
uk-regs-eval = "uk_regs_evals.main:main"
