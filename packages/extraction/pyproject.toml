[project]
name = "uk-regs-extraction"
version = "0.1.0"
description = "PDF parsing, deterministic extractors, LLM rule extraction, and figure understanding"
requires-python = ">=3.12"
dependencies = [
    "uk-regs-core",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "openai>=1.30",
    "instructor>=1.3",
    "tenacity>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_regs_extraction"]