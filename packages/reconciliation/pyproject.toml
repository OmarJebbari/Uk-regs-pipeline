[project]
name = "uk-regs-reconcile"
version = "0.1.0"
description = "Reconciliation engine: matches new rules to the corpus and emits ChangeSets"
requires-python = ">=3.12"
dependencies = [
    "uk-regs-core",
    "uk-regs-extraction",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_regs_reconcile"]