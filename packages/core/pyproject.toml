[project]
name = "uk-regs-core"
version = "0.1.0"
description = "Core domain models, config, and shared types for the UK Regs Pipeline"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dateutil>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_regs_core"]