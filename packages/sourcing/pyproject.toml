[project]
name = "uk-regs-sourcing"
version = "0.1.0"
description = "Source monitoring & auto-ingestion for the UK Regs pipeline"
requires-python = ">=3.12"
dependencies = [
    "uk-regs-core",
    "uk-regs-knowledge",
    "uk-regs-ingest",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_regs_sourcing"]