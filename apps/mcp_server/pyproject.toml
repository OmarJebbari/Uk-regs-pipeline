[project]
name = "uk-regs-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server exposing UK regulation tools to IDE assistants (Cursor/Claude)"
requires-python = ">=3.12"
dependencies = [
    "uk-regs-core",
    "uk-regs-knowledge",
    "mcp>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_regs_mcp"]

[project.scripts]
uk-regs-mcp = "uk_regs_mcp.main:main"