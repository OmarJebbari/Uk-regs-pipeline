<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UK Regs Review{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        :root {
            --bg: #0f1117;
            --bg-card: #181b24;
            --bg-elev: #1f2430;
            --border: #2a3040;
            --text: #e4e7ee;
            --text-muted: #8b93a7;
            --text-dim: #5c6478;
            --accent: #5b8def;
            --accent-hover: #7aa3f7;
            --success: #56d364;
            --warning: #f0c674;
            --danger: #f07178;
            --info: #5ec8e0;
            --radius: 8px;
            --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .nav {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .nav-brand {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        .nav-links { display: flex; gap: 20px; margin-left: auto; }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.15s;
        }
        .nav-links a:hover { color: var(--accent); }
        .nav-links a.active { color: var(--accent); font-weight: 600; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px;
        }

        h1 { font-size: 28px; margin-bottom: 8px; letter-spacing: -0.5px; }
        h2 { font-size: 20px; margin-bottom: 12px; }
        h3 { font-size: 16px; margin-bottom: 8px; color: var(--text); }
        p { color: var(--text-muted); }

        /* ---- Stats row ---- */
        .stats {
            display: flex;
            gap: 16px;
            margin: 24px 0;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 24px;
            min-width: 120px;
            text-align: center;
        }
        .stat-card .num { font-size: 28px; font-weight: 700; }
        .stat-card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card.pending .num { color: var(--warning); }
        .stat-card.applied .num { color: var(--success); }
        .stat-card.rejected .num { color: var(--danger); }
        .stat-card.rolled_back .num { color: var(--text-dim); }

        /* ---- Card list ---- */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 12px;
            transition: border-color 0.15s;
            display: block;
            text-decoration: none;
            color: inherit;
        }
        .card:hover { border-color: var(--accent); }
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .card-id {
            font-family: var(--mono);
            font-size: 13px;
            color: var(--text-muted);
        }
        .card-title { font-size: 16px; font-weight: 600; flex: 1; }

        /* ---- Badges ---- */
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-match { background: rgba(86,211,100,0.15); color: var(--success); }
        .badge-partial { background: rgba(240,198,116,0.15); color: var(--warning); }
        .badge-novel { background: rgba(94,200,224,0.15); color: var(--info); }
        .badge-conflict { background: rgba(240,113,120,0.15); color: var(--danger); }
        .badge-supersede { background: rgba(140,130,220,0.15); color: #a89df0; }

        .status-proposed { color: var(--warning); }
        .status-validated { color: var(--info); }
        .status-applied { color: var(--success); }
        .status-rejected { color: var(--danger); }
        .status-rolled-back { color: var(--text-dim); }

        /* ---- Detail: delta rows ---- */
        .delta-row {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }
        .delta-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .diff-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .diff-pane {
            background: var(--bg-elev);
            border-radius: 6px;
            padding: 16px;
        }
        .diff-pane-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        .diff-pane-old .diff-pane-label { color: var(--danger); }
        .diff-pane-new .diff-pane-label { color: var(--success); }
        .rule-text { font-size: 14px; margin-bottom: 8px; }
        .rule-params {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--info);
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 4px;
        }
        .rationale {
            font-size: 13px;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 12px;
            padding-left: 12px;
            border-left: 3px solid var(--accent);
        }
        .confidence {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-dim);
        }

        /* ---- Review form ---- */
        .review-panel {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-top: 24px;
        }
        .form-row { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        input[type=text], textarea, select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); }
        textarea { min-height: 80px; resize: vertical; }

        .btn-group { display: flex; gap: 12px; }
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-apply { background: var(--success); color: #0f1117; }
        .btn-reject { background: var(--danger); color: #0f1117; }
        .btn-rollback { background: var(--text-dim); color: #0f1117; }

        .flash {
            background: rgba(91,141,239,0.1);
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 16px;
            color: var(--accent);
            font-size: 14px;
        }

        .meta-row {
            display: flex;
            gap: 24px;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
        }
        .meta-row span strong { color: var(--text); }

        .empty {
            text-align: center;
            padding: 64px;
            color: var(--text-dim);
        }

        /* ---- Ops dashboard (Phase 5-3) ---- */
        .ops-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }
        .ops-tile {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .ops-tile .num {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
        }
        .ops-tile .label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-top: 4px;
        }
        .ops-tile.accent .num { color: var(--accent); }
        .ops-tile.success .num { color: var(--success); }
        .ops-tile.warning .num { color: var(--warning); }
        .ops-tile.info .num { color: var(--info); }
        .ops-tile.danger .num { color: var(--danger); }

        .ops-section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 32px;
            margin-bottom: 12px;
            color: var(--text);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }
        .ops-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .breakdown {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .breakdown-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }
        .breakdown-row .name {
            min-width: 130px;
            color: var(--text-muted);
            font-family: var(--mono);
            font-size: 12px;
        }
        .breakdown-row .bar {
            flex: 1;
            height: 10px;
            background: var(--bg-elev);
            border-radius: 5px;
            overflow: hidden;
        }
        .breakdown-row .bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 5px;
            transition: width 0.3s;
        }
        .breakdown-row .count {
            min-width: 40px;
            text-align: right;
            font-family: var(--mono);
            color: var(--text);
            font-weight: 600;
        }

        .ops-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .ops-table th {
            text-align: left;
            padding: 10px 12px;
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }
        .ops-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }
        .ops-table tr:last-child td { border-bottom: none; }
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
        .dot-ok { background: var(--success); }
        .dot-warn { background: var(--warning); }
        .dot-fail { background: var(--danger); }

        .refresh-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .refresh-bar .ts {
            font-size: 12px;
            color: var(--text-dim);
            font-family: var(--mono);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
            border: 1px solid var(--border);
            background: var(--bg-elev);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-brand">🏛 UK Regs Review</div>
        <div class="nav-links">
            <a href="/ui/">Dashboard</a>
            <a href="/ui/audit">Audit</a>
            <a href="/ops">Ops</a>
            <a href="/docs">API Docs</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
