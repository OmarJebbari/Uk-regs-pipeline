[project]
name = "uk-regs-api"
version = "0.1.0"
description = "FastAPI context-serving API: semantic search, get_current, diff, figure retrieval"
requires-python = ">=3.12"
dependencies = [
    "uk-regs-core",
    "uk-regs-knowledge",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_regs_api"]

[project.scripts]
uk-regs-api = "uk_regs_api.main:main"