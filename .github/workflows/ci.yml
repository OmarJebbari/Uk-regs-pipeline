name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint + Tests + Evals Gate
    runs-on: ubuntu-latest

    env:
      # Force the in-memory mock backend so the evals golden gate runs with
      # zero infrastructure (no Postgres, no OpenAI key) in CI.
      UK_REGS_BACKEND: mock

    steps:
      - name: Checkout
        # actions/checkout@v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Install uv
        # astral-sh/setup-uv@v3.2.4
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Dependency audit (known CVEs)
        run: uv audit

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Test suite (includes evals golden gate)
        run: uv run pytest -q

      - name: Run evals offline gate
        run: uv run uk-regs-eval run --no-retrieval --out reports/eval.md

      - name: Upload eval report
        if: always()
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eval-report
          path: reports/eval.md
          if-no-files-found: ignore