name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint + Tests + Evals Gate
    runs-on: ubuntu-latest

    env:
      # Force the in-memory mock backend so the evals golden gate runs with
      # zero infrastructure (no Postgres, no OpenAI key) in CI.
      UK_REGS_BACKEND: mock

    steps:
      - name: Checkout
        # actions/checkout@v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Install uv
        # astral-sh/setup-uv@v3.2.4
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Dependency audit (known CVEs)
        run: uv audit

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Test suite (includes evals golden gate)
        run: uv run pytest -q

      - name: Run evals offline gate
        run: uv run uk-regs-eval run --no-retrieval --out reports/eval.md

      - name: Upload eval report
        if: always()
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eval-report
          path: reports/eval.md
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Docker smoke gate: prove the production image builds from a clean context
  # and that the API process boots inside it (mock backend, no infrastructure).
  # Keeps infra/docker/Dockerfile.* from rotting silently.
  # ---------------------------------------------------------------------------
  docker-smoke:
    name: Docker Build + Smoke Test (API)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout@v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Docker Buildx
        # docker/setup-buildx-action@v3.10.0
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Build API image (local load, no push)
        # docker/build-push-action@v6.9.0
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: infra/docker/Dockerfile.api
          load: true
          tags: uk-regs-api:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container (mock backend, skip boot migrations)
        run: |
          docker run -d --name api-smoke \
            -e UK_REGS_BACKEND=mock \
            -p 8000:8000 \
            uk-regs-api:smoke \
            uvicorn uk_regs_api.app:app --host 0.0.0.0 --port 8000

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              echo "::notice::/healthz responded OK"
              exit 0
            fi
            sleep 2
          done
          echo "::error::/healthz did not respond within 60s"
          exit 1

      - name: Dump container logs
        if: failure()
        run: docker logs api-smoke

      - name: Tear down
        if: always()
        run: docker rm -f api-smoke

  # ---------------------------------------------------------------------------
  # Terraform gate: format check, init (no backend), validate, and a
  # speculative plan of a fresh stack (no state → full-create plan). Proves the
  # IaC in infra/terraform parses and plans cleanly before it reaches AWS.
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform fmt / validate / plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        # actions/checkout@v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Set up Terraform
        # hashicorp/setup-terraform@v3.1.2
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (speculative, no state)
        run: terraform plan -input=false -lock=false -no-color -out=tfplan
        env:
          TF_IN_AUTOMATION: "true"

      - name: Terraform show (plan summary)
        run: terraform show -no-color tfplan | head -40
