name: Deploy

# Continuous delivery: build & push all production images to ECR, then roll the
# ECS API service. Triggered manually (workflow_dispatch) or by version tags.
#
# Required repository configuration (Settings → Secrets / Variables):
#   Secrets:
#     AWS_DEPLOY_ROLE_ARN  — IAM role to assume via GitHub OIDC
#                            (trust the github-actions OIDC provider, see README)
#   Variables (optional overrides):
#     AWS_REGION           — default eu-west-2
#     ECR_NAMESPACE        — default uk-regs (repos: uk-regs/api, .../worker, .../mcp)
#     ECS_CLUSTER          — default uk-regs-cluster
#     ECS_API_SERVICE      — default uk-regs-api

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment label (informational)"
        required: false
        default: "prod"
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel a mid-flight production rollout

permissions:
  contents: read
  id-token: write # GitHub OIDC → AWS IAM role (no long-lived keys)

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
  ECR_NAMESPACE: ${{ vars.ECR_NAMESPACE || 'uk-regs' }}

jobs:
  build:
    name: Build & push image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, mcp]

    steps:
      - name: Checkout
        # actions/checkout@v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Configure AWS credentials (OIDC)
        # aws-actions/configure-aws-credentials@v4.3.1
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        # aws-actions/amazon-ecr-login@v2.1.0
        uses: aws-actions/amazon-ecr-login@c75a9a1d9c6f7cf1e4cfb2966839b590c3d46865

      - name: Set up Docker Buildx
        # docker/setup-buildx-action@v3.10.0
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Build & push ${{ matrix.service }}
        # docker/build-push-action@v6.9.0
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          # Immutable sha tag + moving 'latest' (the Terraform task defs pin :latest).
          tags: |
            ${{ env.AWS_REGION }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.AWS_REGION }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-api:
    name: Roll out ECS API service
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS credentials (OIDC)
        # aws-actions/configure-aws-credentials@v4.3.1
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment (picks up freshly pushed :latest)
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_API_SERVICE}" \
            --force-new-deployment
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'uk-regs-cluster' }}
          ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE || 'uk-regs-api' }}

      - name: Wait for service stability
        run: |
          echo "Waiting for ECS service to reach steady state (this can take several minutes)..."
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_API_SERVICE}"
          echo "::notice::ECS service is stable — rollout complete."
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'uk-regs-cluster' }}
          ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE || 'uk-regs-api' }}